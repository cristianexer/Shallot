name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Set per job by the "Select Xcode" step rather than pinned to one app
  # bundle: runner images rename Xcode between releases, and a hard-coded
  # path fails with a confusing "command not found" rather than a clear one.
  MINIMUM_XCODE: "26.0"
  PROJECT: Shallot.xcodeproj
  SCHEME: Shallot
  # Signing is off for simulator builds; CI has no certificates and does not
  # need any, because the in-app proxy route needs no entitlement.
  UNSIGNED: >-
    CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

jobs:
  # ---------------------------------------------------------------------------
  # Build + the hermetic test suites. Runs on every push and pull request.
  #
  # ShallotTests and ShallotUITests are deliberately hermetic: AppContainer
  # detects the test host and substitutes MockTorService and an in-memory store,
  # so nothing here needs the Tor network to be reachable from a runner.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode and install xcbeautify
        run: |
          .github/scripts/select-xcode.sh
          brew install xcbeautify
          xcodebuild -version
          swift --version

      # The embedded Tor C library (swift-tor -> swift-openssl) is slow to
      # build from source, so both the resolved checkouts and the SwiftPM
      # build products are cached. The key is the resolved-versions file, so
      # the cache invalidates exactly when a dependency actually moves.
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            .build
          key: >-
            ${{ runner.os }}-spm-${{ hashFiles(
              'Shallot.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved',
              'Packages/ShallotCore/Package.swift'
            ) }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Resolve packages
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -resolvePackageDependencies

      # Every step below runs from a script so the same gate can be run
      # locally — `.github/scripts/test.sh` — instead of being debugged by
      # pushing commits and reading someone else's log.
      - name: Build and test
        env:
          SHALLOT_DERIVED_DATA: DerivedData
          XCBEAUTIFY_RENDERER: github-actions
        run: .github/scripts/test.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults-*.xcresult
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Style gates.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Select Xcode
        run: .github/scripts/select-xcode.sh

      # Also runnable locally: `.github/scripts/lint.sh`.
      - name: Lint
        run: .github/scripts/lint.sh

  # ---------------------------------------------------------------------------
  # Integration, leak and performance suites.
  #
  # THESE ARE NOT RUN ON EVERY PULL REQUEST, ON PURPOSE.
  #
  # They need a real network: they bootstrap a real Tor, fetch
  # check.torproject.org/api/ip to assert IsTor == true and that the exit IP is
  # not the device's, load a real .onion, prove per-tab circuit isolation gives
  # two different exit IPs, and drive the WebKit proxy-bypass proof-of-concepts
  # to confirm the DNS-prefetch, WebAuthn, WebTransport and WebRTC mitigations
  # hold. On a shared GitHub runner they are slow, flaky and — because Tor exit
  # traffic from CI ranges is frequently blocked or captcha'd — not a reliable
  # signal. They belong on a device lane or a nightly job with real hardware.
  #
  # Anything whose test or suite name contains "Live" or "Integration" is
  # selected here and excluded above. Trigger from the Actions tab, or on a
  # schedule once a device lane exists.
  # ---------------------------------------------------------------------------
  live-integration:
    name: Live integration, leak and performance suites (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode and install xcbeautify
        run: |
          .github/scripts/select-xcode.sh
          brew install xcbeautify

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            .build
          key: >-
            ${{ runner.os }}-spm-${{ hashFiles(
              'Shallot.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved',
              'Packages/ShallotCore/Package.swift'
            ) }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Resolve packages
        run: xcodebuild -project "$PROJECT" -scheme "$SCHEME" -resolvePackageDependencies

      # The simulator is discovered rather than pinned by name: which iPhone
      # models exist depends on the runtime the runner's Xcode ships, and a
      # hard-coded name fails outright the moment that moves. The script asks
      # simctl directly, creates a device if the image has a runtime but no
      # ready one, and dumps the runtime and device lists if it still cannot
      # find anything — so a future failure is diagnosable from the log.
      - name: Pick a simulator
        id: sim
        run: |
          udid=$(.github/scripts/pick-simulator.sh)
          echo "Using simulator $udid"
          echo "destination=platform=iOS Simulator,id=$udid" >> "$GITHUB_OUTPUT"

      # The convention: any test type whose name contains "Live" or
      # "Integration" needs the real network. They are discovered from the
      # sources rather than listed here, so adding one is a matter of naming it
      # correctly — it is then picked up by this job and, by the same rule,
      # skipped by the pull-request job above.
      - name: Discover live suites
        id: discover
        run: |
          suites=$(grep -rhoE '^ *(public |internal |final )*(class|struct) +[A-Za-z0-9_]*(Live|Integration)[A-Za-z0-9_]*' \
            --include='*.swift' ShallotTests ShallotUITests 2>/dev/null \
            | awk '{ print $NF }' | sort -u)
          flags=""
          for suite in $suites; do
            if grep -rql "$suite" --include='*.swift' ShallotUITests 2>/dev/null; then
              flags="$flags -only-testing:ShallotUITests/$suite"
            else
              flags="$flags -only-testing:ShallotTests/$suite"
            fi
          done
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          if [ -z "$flags" ]; then
            echo "::notice::No Live/Integration suites in the tree yet — nothing to run."
          else
            echo "Selected:$flags"
          fi

      # The live suites are opt-in at runtime as well as at selection time.
      # `xcodebuild` does not forward its own environment into a test host
      # running in the simulator, so the switch is a marker file on the shared
      # filesystem — see `shallotLiveTestsEnabled()`.
      - name: Enable the live suites
        if: steps.discover.outputs.flags != ''
        run: touch /tmp/shallot-live-tests

      - name: Live suites
        if: steps.discover.outputs.flags != ''
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "${{ steps.sim.outputs.destination }}" \
            -derivedDataPath DerivedData \
            ${{ steps.discover.outputs.flags }} \
            -only-testing:ShallotTests/PerformanceTests \
            -resultBundlePath TestResults-Live.xcresult \
            $UNSIGNED | xcbeautify --renderer github-actions

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-results
          path: TestResults-Live.xcresult
          if-no-files-found: ignore
